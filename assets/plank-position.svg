<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="t d"><title id="t">Forearm plank position</title><desc id="d">Schematic side view: elbows below shoulders, hips aligned with the torso, toes and forearms supported on the floor.</desc><rect width="760" height="300" rx="20" fill="#edf6ef"/><path d="M65 238H695" stroke="#718478" stroke-width="3"/><path d="M183 122L365 150 615 210 648 237M183 122L168 235 105 235" fill="none" stroke="#176b4d" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><circle cx="147" cy="99" r="25" fill="#176b4d"/><path d="M185 125L615 210" stroke="#b93212" stroke-width="2" stroke-dasharray="7 6"/><g font-family="system-ui,sans-serif" font-size="17" fill="#13271f"><text x="70" y="45">Elbows under shoulders</text><path d="M180 52V100" stroke="#13271f"/><text x="350" y="60">Keep trunk and hips aligned</text><path d="M420 70L400 145" stroke="#13271f"/><text x="340" y="275">Breathe throughout the hold</text></g></svg>
