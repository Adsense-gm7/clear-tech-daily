<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="t d"><title id="t">Hip hinge movement concept</title><desc id="d">Schematic side view: hips move backward, knees remain slightly bent, torso inclines forward and the load stays close to the legs.</desc><rect width="760" height="330" rx="20" fill="#edf6ef"/><path d="M70 285H690" stroke="#718478" stroke-width="3"/><path d="M370 143L330 215 350 283 397 283M370 143L475 90M457 100L424 232" fill="none" stroke="#176b4d" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/><circle cx="505" cy="74" r="24" fill="#176b4d"/><path d="M410 237H448M410 225V249M448 225V249" stroke="#13271f" stroke-width="9"/><path d="M350 140H265L278 130M265 140L278 150" stroke="#b93212" stroke-width="4" fill="none"/><g font-family="system-ui,sans-serif" font-size="17" fill="#13271f"><text x="95" y="111">Move hips back</text><text x="90" y="224">Soft knee bend</text><path d="M230 218H315" stroke="#13271f"/><text x="493" y="198">Load close to legs</text><path d="M490 205L450 230" stroke="#13271f"/><text x="90" y="315">Range ends before you lose control; reaching the floor is unnecessary.</text></g></svg>
