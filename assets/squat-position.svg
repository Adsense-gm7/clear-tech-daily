<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="t d"><title id="t">Squat to a stable chair</title><desc id="d">Schematic side view of a squat toward a chair, with heels on the floor and the torso leaning forward. Chair height determines the practice depth.</desc><rect width="760" height="330" rx="20" fill="#edf6ef"/><path d="M80 285H680" stroke="#718478" stroke-width="3"/><path d="M240 205H350V282M250 205V282" fill="none" stroke="#718478" stroke-width="9"/><path d="M325 194L430 208 405 282 457 282M325 194L385 106M375 120L475 137 510 118" fill="none" stroke="#176b4d" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/><circle cx="404" cy="77" r="24" fill="#176b4d"/><g font-family="system-ui,sans-serif" font-size="17" fill="#13271f"><text x="65" y="140">Touch, do not drop</text><path d="M235 147L300 195" stroke="#13271f"/><text x="475" y="250">Keep heels supported</text><path d="M490 257L420 279" stroke="#13271f"/><text x="80" y="315">Choose a stable chair and a depth you can control. Body proportions vary.</text></g></svg>
